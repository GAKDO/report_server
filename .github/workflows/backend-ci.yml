# 서버 빌드와 테스트. (블로그 backend-ci.yml을 옮김: Maven verify + JaCoCo 줄 커버리지 40% + 학교 SonarQube)
name: backend-ci

# 언제 도나: ① PR ② develop push ③ 배포(deploy.yml)가 main·develop 이미지 전에 불러 쓸 때(workflow_call)
# 흐름: 코드 받기 → Java 21 → mvnw verify(테스트 + JaCoCo 40%) → 커버리지 보고서 → (켜져 있으면) SonarQube → 실패 시 테스트 보고서
on:
  pull_request:   # PR은 문서만 바뀌어도 돈다: 필수 검사가 '대기'로 멈춰 머지가 막히지 않게
  push:
    branches: [develop]
    paths-ignore: ["**/*.md"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # SonarQube가 줄별 작성자(blame)를 읽게 전체 이력을 받는다
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = 컴파일 → 테스트 → JaCoCo 커버리지 검사(pom.xml에 기준 40%)
      - name: 테스트 + 커버리지 기준 (줄 40%)
        run: ./mvnw -B -ntp verify
      - name: 커버리지 보고서
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
      # 코드 품질 분석. push일 때만, 레포(또는 조직) 변수 SONAR_ENABLED=true이고 SONAR_TOKEN이 있을 때만.
      # 학교 SonarQube: Secret SONAR_HOST_URL=http://s4.java21.net:9000. 품질 서버가 내려가 있어도 CI 초록은 막지 않는다
      - name: SonarQube 분석
        id: sonar
        if: vars.SONAR_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('trace-{0}', github.event.repository.name) }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN이 없어 건너뜁니다."; exit 0; fi
          org=()
          if [ -n "$SONAR_ORGANIZATION" ]; then org=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            "${org[@]}" \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      - name: SonarQube 실패 알림
        if: steps.sonar.outcome == 'failure' && (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true')
        uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "[${{ github.event.repository.name }}] SonarQube 분석 실패"
          description: "빌드·테스트는 통과했고 SonarQube 분석만 실패했습니다."
          status: failure
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: target/surefire-reports
