# CodeRabbit AI 리뷰 설정. 레포에 CodeRabbit GitHub 앱을 설치하면 PR마다 이 파일을 읽는다.
# (블로그 .coderabbit.yaml과 같은 방식: 한국어 리뷰 + 팀 설계 규칙을 리뷰 기준으로)
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치(main) 말고도 develop으로 가는 기능 PR을 리뷰한다(CONTRIBUTING.md, Git Flow)
    base_branches:
      - "^develop$"
  path_filters:
    - "!**/package-lock.json"
  path_instructions:
    - path: "src/main/java/**"
      instructions: >-
        GAKDO/docs의 design/(요구사항·ERD·REST API v0)을 기준으로 본다. 다른 서비스 스키마에 외래 키를 걸거나 직접 쿼리하지 않는지,
        권한 확인(역할 × 경로 표), 입력 검증, 트랜잭션 경계, N+1 쿼리, 비밀값 로그 출력을 우선 확인한다.
    - path: "src/main/resources/db/migration/**"
      instructions: >-
        이미 배포된 마이그레이션 파일을 고치지 않는지, 번호가 이어지는지, 데이터 손실이 없는지 본다.
    - path: "Dockerfile"
      instructions: >-
        컨테이너가 루트로 돌지 않는지, 비밀값을 이미지에 굽지 않는지 본다.
    - path: ".github/workflows/**"
      instructions: >-
        PR 제목·본문 같은 외부 입력을 run 스크립트에 직접 넣지 않는지, 권한(permissions)이 최소인지 본다.
chat:
  auto_reply: true
